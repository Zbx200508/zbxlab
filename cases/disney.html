<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="香港迪士尼项目展示整理页。" />
    <title>香港迪士尼项目 | ZBX Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/case-placeholder.css" />
  </head>
  <body class="case-disney">
    <main class="disney-stage" aria-label="香港迪士尼项目背景展示">
      <a class="disney-back" href="../index.html" aria-label="返回作品集">←</a>

      <div class="disney-sky" aria-hidden="true">
        <span class="sparkle sparkle-one"></span>
        <span class="sparkle sparkle-two"></span>
        <span class="sparkle sparkle-three"></span>
        <span class="sparkle sparkle-four"></span>
      </div>

      <div class="disney-logo-scene" aria-hidden="true">
        <span class="disney-logo-mask"></span>
        <img class="disney-logo-mark" src="../assets/logos/hong-kong-disneyland.svg" alt="" />
      </div>

      <svg class="disney-magic-arc" viewBox="0 0 620 260" aria-hidden="true">
        <path
          class="magic-arc"
          d="M92 205C168 18 454 18 528 205"
          pathLength="1"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="2.6"
        />
        <circle class="magic-comet" cx="92" cy="205" r="4.5" fill="currentColor" />
      </svg>
    </main>

    <script>
      const stage = document.querySelector(".disney-stage");

      function replayFirework() {
        stage.classList.remove("is-replaying");
        void stage.offsetWidth;
        stage.classList.add("is-replaying");
      }

      window.addEventListener("load", replayFirework);
    </script>
  </body>
</html>
