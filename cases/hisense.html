<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="description" content="海信自动化报告工作台项目展示页。" />
    <title>海信自动化报告工作台 | ZBX Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/hisense.css?v=20260831-bg-light-1" />
  </head>
  <body>
    <header class="case-header">
      <a class="back-arrow" href="../index.html" aria-label="返回作品集">←</a>
      <nav class="case-jump-nav" aria-label="原型快速定位">
        <button type="button" data-scroll-target="self-built">内部报告生成工作台</button>
        <button type="button" data-scroll-target="formal-center">正式周报配置中心</button>
      </nav>
    </header>

    <main class="gallery-stage">
      <div class="deep-mask"></div>
      <div class="grid-field"></div>
      <div class="green-beam beam-one"></div>
      <div class="green-beam beam-two"></div>
      <div class="wave-field wave-one"></div>
      <div class="wave-field wave-two"></div>
      <div class="glass-orbit orbit-one"></div>
      <div class="glass-orbit orbit-two"></div>
      <div class="noise-layer"></div>

      <section class="exhibit" aria-labelledby="case-title">
        <h1 id="case-title" class="sr-only">海信自动化报告工作台</h1>

        <article id="self-built" class="case-row" aria-labelledby="phase-one-title">
          <div class="prototype-column">
            <h2 id="phase-one-title" class="prototype-title">内部报告生成工作台</h2>
            <article class="gallery-piece prototype-piece">
              <a class="piece-link" href="../demos/hisense-self-built-prototype.html" aria-label="打开内部报告工作台原型"></a>
              <div class="prototype-viewport" aria-hidden="true">
                <iframe
                  src="../demos/hisense-self-built-prototype.html"
                  title="内部报告工作台原型缩略图"
                  scrolling="no"
                  tabindex="-1"
                  onload="this.contentDocument.documentElement.style.overflow='hidden';this.contentDocument.body.style.overflow='hidden';"
                ></iframe>
              </div>
            </article>
          </div>
          <aside class="gallery-side" aria-label="内部报告工作台方案">
            <article class="gallery-piece prd-piece">
              <a class="piece-link" href="../prd/hisense-internal-workbench.html" aria-label="打开内部报告工作台方案"></a>
              <span class="placeholder-label">方案</span>
              <h2>交付前内部工具</h2>
              <p>承接正式系统上线前的周报制作，集中处理配置、取数、计算、帖子拉取、AI 洞察和 HTML 报告渲染，并通过进度节点定位异常。</p>
              <div class="prd-outline" aria-hidden="true">
                <span>人工流程</span>
                <span>流程拆解</span>
                <span>生成进度</span>
                <span>交付结果</span>
              </div>
            </article>
          </aside>
        </article>

        <article id="formal-center" class="case-row" aria-labelledby="phase-two-title">
          <div class="prototype-column">
            <h2 id="phase-two-title" class="prototype-title">正式周报配置中心</h2>
            <article class="gallery-piece prototype-piece">
              <a class="piece-link" href="../demos/hisense-weekly-config.html" aria-label="打开正式报告工作台原型"></a>
              <div class="prototype-viewport" aria-hidden="true">
                <iframe
                  src="../demos/hisense-weekly-config.html"
                  title="正式报告工作台原型缩略图"
                  scrolling="no"
                  tabindex="-1"
                  onload="this.contentDocument.documentElement.style.overflow='hidden';this.contentDocument.body.style.overflow='hidden';"
                ></iframe>
              </div>
            </article>
          </div>
          <aside class="gallery-side" aria-label="正式周报配置中心产品方案">
            <article class="gallery-piece prd-piece">
              <a class="piece-link" href="../prd/hisense-formal-weekly-center-prd.html" aria-label="打开正式周报配置中心产品方案"></a>
              <span class="placeholder-label">方案</span>
              <h2>产品方案设计</h2>
              <p>正式交付阶段重构生成报告与历史报告页面，沉淀 5 步配置、前置校验、状态流转、配置快照和复用规则。</p>
              <div class="prd-outline" aria-hidden="true">
                <span>配置页面重构</span>
                <span>交互校验规则</span>
                <span>历史报告页面</span>
                <span>异常与重试</span>
              </div>
            </article>
          </aside>
        </article>
      </section>
    </main>
    <script>
      document.querySelectorAll("[data-scroll-target]").forEach((button) => {
        button.addEventListener("click", () => {
          const target = document.getElementById(button.dataset.scrollTarget);
          if (!target) return;
          const top = target.getBoundingClientRect().top + window.scrollY - 72;
          window.scrollTo({ top, behavior: "smooth" });
        });
      });
    </script>
  </body>
</html>
